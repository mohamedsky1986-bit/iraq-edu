<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة المتفوق التعليمية العراقية | الابتدائية (١ - ٦)</title>
    <meta name="description" content="المنصة التعليمية العراقية الرائدة للمرحلة الابتدائية من الصف الأول إلى السادس." />
    
    <!-- تحميل الخطوط مسبقاً وبشكل متوازي وسريع -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

    <style>
      /* ستايل شاشة التحميل الفورية بدون انتظار أي ملفات خارجية */
      body { margin: 0; background-color: #f8fafc; }
      .initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
      }
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #059669;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-amber-200 selection:text-amber-900">
    <div id="root">
      <!-- شاشة تحميل فورية تظهر أول ما يضغط المستخدم على الرابط وتختفي تلقائياً فور تحميل المنصة -->
      <div class="initial-loader">
        <div style="font-size: 42px; margin-bottom: 12px;">🇮🇶 📚</div>
        <div class="loader-spinner"></div>
        <div style="font-weight: 700; font-size: 18px; color: #0f172a;">منصة المتفوق التعليمية العراقية</div>
        <div style="font-size: 13px; color: #64748b; margin-top: 6px;">جاري تشغيل المنصة...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
