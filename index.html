    <meta property="og:description" content="منصة تعليمية عراقية تفاعلية للمرحلة الابتدائية من الصف الأول إلى السادس الوزاري" />

    <!-- إعدادات تطبيق الويب وتثبيته على الموبايل والحاسبة (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="المتفوق" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- خطوط المنهاج العراقي الرسمية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
      /* شاشة التحميل الخضراء الفورية مع اللوغو قبل فتح التطبيق (تمنع الشاشة البيضاء) */
      .initial-splash-screen {
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 50%, #f8fafc 100%);
        font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        direction: rtl;
      }
      .splash-logo-box {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 28px;
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        box-shadow: 0 18px 38px rgba(5, 150, 105, 0.28), 0 0 0 6px rgba(16, 185, 129, 0.15);
        margin-bottom: 24px;
        animation: splashPulse 1.8s infinite ease-in-out;
      }
      @keyframes splashPulse {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.04); }
      }
      .splash-title {
        font-size: 22px;
        font-weight: 900;
        color: #064e3b;
        margin: 0 0 6px 0;
      }
      .splash-subtitle {
        font-size: 14px;
        font-weight: 700;
        color: #059669;
        margin: 0 0 24px 0;
      }
      /* علامة التحميل الدائرية باللون الأخضر */
      .splash-spinner {
        width: 46px;
        height: 46px;
        border: 4px solid #d1fae5;
        border-top-color: #059669;
        border-right-color: #10b981;
        border-radius: 50%;
        animation: splashSpin 0.85s linear infinite;
        margin-bottom: 14px;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
      .splash-status {
        font-size: 13px;
        font-weight: 800;
        color: #475569;
      }

      /* شريط التثبيت التلقائي الفوري أعلى الصفحة باللون الأخضر */
      #pwa-install-banner {
        display: none;
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 24px);
        max-width: 500px;
        z-index: 999999;
        background: linear-gradient(135deg, #065f46 0%, #047857 50%, #0f172a 100%);
        color: #ffffff;
        padding: 12px 16px;
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.2);
        font-family: 'Tajawal', 'Cairo', system-ui, sans-serif;
        animation: pwaSlideDown 0.4s ease-out;
        direction: rtl;
        text-align: right;
      }
      @keyframes pwaSlideDown {
        from { opacity: 0; transform: translate(-50%, -20px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }
      #pwa-install-banner .pwa-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      #pwa-install-banner .pwa-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #pwa-install-banner .pwa-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        flex-shrink: 0;
      }
      #pwa-install-banner .pwa-title {
        font-weight: 900;
        font-size: 13px;
        line-height: 1.2;
        color: #ffffff;
      }
      #pwa-install-banner .pwa-desc {
        font-size: 11px;
        color: #a7f3d0;
        margin-top: 2px;
        font-weight: 500;
      }
      #pwa-install-banner .pwa-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      #pwa-install-btn {
        background: #f59e0b;
        color: #0f172a;
        font-weight: 900;
        font-size: 12px;
        border: none;
        padding: 8px 14px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        transition: transform 0.15s, background 0.15s;
        white-space: nowrap;
      }
      #pwa-install-btn:hover {
        background: #fbbf24;
        transform: scale(1.05);
      }
      #pwa-close-btn {
        background: transparent;
        border: none;
        color: #cbd5e1;
        font-size: 16px;
        cursor: pointer;
        padding: 4px 6px;
        line-height: 1;
      }
      #pwa-close-btn:hover {
        color: #ffffff;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-amber-200 selection:text-amber-900">

    <!-- شريط طلب التثبيت التلقائي للباركود والموبايل باللون الأخضر -->
    <div id="pwa-install-banner">
      <div class="pwa-inner">
        <div class="pwa-info">
          <div class="pwa-icon">🎓</div>
          <div>
            <div class="pwa-title">تطبيق منصة المتفوق 🇮🇶</div>
            <div class="pwa-desc">تثبيت التطبيق على شاشة هاتفك</div>
          </div>
        </div>
        <div class="pwa-actions">
          <button id="pwa-install-btn" type="button">تثبيت التطبيق 📲</button>
          <button id="pwa-close-btn" type="button" aria-label="إغلاق">✕</button>
        </div>
      </div>
    </div>

    <!-- شاشة التحميل الخضراء واللوغو قبل فتح المنصة (تختفي تلقائياً فور فتح التطبيق) -->
    <div id="root">
      <div class="initial-splash-screen">
        <div class="splash-logo-box">🎓</div>
        <h1 class="splash-title">منصة المتفوق التعليمية العراقية 🇮🇶</h1>
        <p class="splash-subtitle">المناهج والامتحانات الابتدائية (الصف الأول – السادس الوزاري)</p>
        <div class="splash-spinner" aria-label="جاري التحميل"></div>
        <div class="splash-status">جاري فتح المنصة وتحميل المناهج...</div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- سكربت إظهار زر التثبيت فور فتح الباركود -->
    <script>
      (function() {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (isStandalone) return;

        let deferredPrompt = null;
        const banner = document.getElementById('pwa-install-banner');
        const installBtn = document.getElementById('pwa-install-btn');
        const closeBtn = document.getElementById('pwa-close-btn');

        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          deferredPrompt = e;
          if (banner) banner.style.display = 'block';
        });

        setTimeout(function() {
          if (banner && !isStandalone && !sessionStorage.getItem('pwa_dismissed')) {
            banner.style.display = 'block';
          }
        }, 1200);

        if (installBtn) {
          installBtn.addEventListener('click', function() {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              deferredPrompt.userChoice.then(function(choiceResult) {
                if (choiceResult.outcome === 'accepted') {
                  banner.style.display = 'none';
                }
                deferredPrompt = null;
              });
            } else {
              const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
              if (isIOS) {
                alert('📱 لتثبيت التطبيق على الآيفون:\n\n1. اضغط على زر المشاركة (المربع الذي يخرج منه سهم ⬆️) أسفل الشاشة.\n2. مرر للأسفل واختر (إضافة إلى الشاشة الرئيسية 📲).\n\nسيتثبت التطبيق فوراً كبرنامج رسمي على شاشتك!');
              } else {
                alert('📱 لتثبيت التطبيق على جهازك:\n\n1. اضغط على خيارات المتصفح (⋮) في أعلى زاوية الشاشة.\n2. اختر (تثبيت التطبيق) أو (إضافة إلى الشاشة الرئيسية).\n\nسيتثبت التطبيق فوراً وبدون أي تحذيرات!');
              }
            }
          });
        }

        if (closeBtn) {
          closeBtn.addEventListener('click', function() {
            if (banner) banner.style.display = 'none';
            sessionStorage.setItem('pwa_dismissed', 'true');
          });
        }
      })();
    </script>
  </body>
</html>
