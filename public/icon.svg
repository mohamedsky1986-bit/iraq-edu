<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="12" opacity="0.3"/>
  
  <!-- Graduation Cap -->
  <polygon points="256,120 420,200 256,280 92,200" fill="#ffffff" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.2))"/>
  <polygon points="170,250 342,250 310,320 202,320" fill="url(#gold)"/>
  <!-- Tassel -->
  <circle cx="256" cy="200" r="10" fill="#f59e0b"/>
  <path d="M 256 200 Q 370 230 380 300" stroke="#f59e0b" stroke-width="8" fill="none"/>
  <circle cx="380" cy="305" r="12" fill="#f59e0b"/>
  
  <!-- Badge Label: العراق IQ -->
  <rect x="146" y="360" width="220" height="60" rx="30" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
  <text x="256" y="402" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" direction="rtl">العراق 🇮🇶 IQ</text>
</svg>
